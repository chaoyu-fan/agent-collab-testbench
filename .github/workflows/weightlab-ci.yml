name: WeightSpace Agent Lab CPU checks

on:
  push:
    branches: [weightspace-agent-lab]
  pull_request:
    branches: [weightspace-agent-lab]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-methods.txt
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Organizer end-to-end smoke test
        run: |
          python weightlab.py prepare --out runs/ci --seed 12121
          python weightlab.py demo-patch --model runs/ci/participant/model.npz --out runs/ci/noop.npz
          python weightlab.py evaluate --participant runs/ci/participant --organizer runs/ci/organizer --patch runs/ci/noop.npz --output runs/ci/noop_result.json
          python -c 'import json; d=json.load(open("runs/ci/noop_result.json")); assert d["accuracy_gain_pp"] == 0 and d["valid_patch"]'
